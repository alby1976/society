name: Build Governance Vault

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build vault
        run: python build.py

      - name: Validate YAML
        run: python scripts/validate_yaml.py

      - name: Check links
        run: python scripts/check_links.py

      - name: Audit all
        run: python scripts/audit_all.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccts-build-reports
          path: dist/reports/
